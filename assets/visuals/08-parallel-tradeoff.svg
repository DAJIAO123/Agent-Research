<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f7fafc"/><text x="70" y="78" font-family="Arial" font-size="34" font-weight="700" fill="#102a43">并行收益必须超过协调成本</text><g font-family="Arial" font-size="25"><rect x="120" y="220" width="420" height="390" rx="18" fill="#e6f4f0" stroke="#9cd5c5"/><text x="205" y="290" fill="#14685b">并行收益</text><text x="180" y="370" fill="#526b84">独立研究线</text><text x="180" y="425" fill="#526b84">互不冲突的测试</text><text x="180" y="480" fill="#526b84">更短墙钟时间</text><rect x="660" y="220" width="420" height="390" rx="18" fill="#fff0f2" stroke="#f2a5b2"/><text x="745" y="290" fill="#b21f45">协调成本</text><text x="720" y="370" fill="#526b84">上下文复制</text><text x="720" y="425" fill="#526b84">状态同步</text><text x="720" y="480" fill="#526b84">冲突与合并</text></g><path d="M540 415h120" stroke="#6b879f" stroke-width="5" marker-end="url(#l)"/><text x="335" y="735" font-family="Arial" font-size="25" fill="#526b84">只有输入独立、边界清楚、结果可合并时才值得拆分</text><defs><marker id="l" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6b879f"/></marker></defs></svg>
