<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">中断结束当前 Turn，恢复重建可继续状态</title>
  <desc id="desc">执行中的 Turn 被中断后保留已完成事件，冷恢复读取 rollout 并重建历史，新的 Turn 从保存的 Thread 继续。</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#cfdae3"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#557083"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#f8fafc"/><rect width="1200" height="900" fill="url(#dots)"/>
  <text x="72" y="82" fill="#10283d" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">中断结束当前 Turn，恢复重建可继续状态</text>
  <text x="72" y="124" fill="#5c7182" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="18">暂停不是清空历史，恢复也不是让旧模型调用重新运行</text>

  <g font-family="Inter, 'Microsoft YaHei', sans-serif">
    <text x="92" y="220" fill="#12628d" font-size="18" font-weight="700">运行阶段</text>
    <line x1="92" y1="302" x2="1108" y2="302" stroke="#557083" stroke-width="3"/>
    <circle cx="150" cy="302" r="28" fill="#dceffb" stroke="#9cc9e4" stroke-width="2"/><text x="150" y="309" text-anchor="middle" fill="#12628d" font-size="18" font-weight="700">1</text>
    <text x="150" y="362" text-anchor="middle" fill="#10283d" font-size="17" font-weight="700">Turn 开始</text>
    <circle cx="360" cy="302" r="28" fill="#fff1d3" stroke="#e0bd70" stroke-width="2"/><text x="360" y="309" text-anchor="middle" fill="#825400" font-size="18" font-weight="700">2</text>
    <text x="360" y="362" text-anchor="middle" fill="#10283d" font-size="17" font-weight="700">完成部分 Items</text>
    <circle cx="570" cy="302" r="34" fill="#fff0f1" stroke="#e7a2aa" stroke-width="2"/><text x="570" y="309" text-anchor="middle" fill="#a52e3d" font-size="18" font-weight="700">STOP</text>
    <text x="570" y="362" text-anchor="middle" fill="#10283d" font-size="17" font-weight="700">Turn 中断</text>
    <line x1="604" y1="302" x2="604" y2="184" stroke="#d63b4c" stroke-width="3"/>
    <rect x="470" y="168" width="268" height="54" rx="27" fill="#fff0f1" stroke="#e7a2aa"/>
    <text x="604" y="202" text-anchor="middle" fill="#9a2938" font-size="16" font-weight="600">终态：Interrupted</text>

    <path d="M604 302H718" stroke="#c2ced7" stroke-width="3" stroke-dasharray="9 8"/>
    <rect x="740" y="236" width="368" height="132" rx="16" fill="#ffffff" stroke="#8fd8ca" stroke-width="2"/>
    <text x="772" y="278" fill="#087563" font-size="18" font-weight="700">Thread 仍保留现场</text>
    <text x="772" y="314" fill="#5c7182" font-size="16">已完成 Items · Turn 终态 · 上下文元数据</text>
    <text x="772" y="344" fill="#a34b55" font-size="15">已经发生的文件副作用不会自动撤销</text>

    <path d="M924 368V468" stroke="#557083" stroke-width="3" marker-end="url(#arr)"/>
    <text x="948" y="424" fill="#5c7182" font-size="15">thread/resume</text>

    <text x="92" y="500" fill="#087563" font-size="18" font-weight="700">恢复阶段</text>
    <rect x="92" y="536" width="1016" height="178" rx="18" fill="#ffffff" stroke="#8fd8ca" stroke-width="2"/>
    <g>
      <circle cx="174" cy="616" r="28" fill="#daf3ed" stroke="#83cbbb" stroke-width="2"/><text x="174" y="623" text-anchor="middle" fill="#087563" font-size="18" font-weight="700">3</text>
      <text x="174" y="674" text-anchor="middle" fill="#10283d" font-size="16" font-weight="700">读取 rollout</text>
      <path d="M214 616H314" stroke="#557083" stroke-width="3" marker-end="url(#arr)"/>
      <circle cx="360" cy="616" r="28" fill="#daf3ed" stroke="#83cbbb" stroke-width="2"/><text x="360" y="623" text-anchor="middle" fill="#087563" font-size="18" font-weight="700">4</text>
      <text x="360" y="674" text-anchor="middle" fill="#10283d" font-size="16" font-weight="700">识别事件边界</text>
      <path d="M400 616H500" stroke="#557083" stroke-width="3" marker-end="url(#arr)"/>
      <circle cx="546" cy="616" r="28" fill="#daf3ed" stroke="#83cbbb" stroke-width="2"/><text x="546" y="623" text-anchor="middle" fill="#087563" font-size="18" font-weight="700">5</text>
      <text x="546" y="674" text-anchor="middle" fill="#10283d" font-size="16" font-weight="700">重建存活历史</text>
      <path d="M586 616H686" stroke="#557083" stroke-width="3" marker-end="url(#arr)"/>
      <circle cx="732" cy="616" r="28" fill="#daf3ed" stroke="#83cbbb" stroke-width="2"/><text x="732" y="623" text-anchor="middle" fill="#087563" font-size="18" font-weight="700">6</text>
      <text x="732" y="674" text-anchor="middle" fill="#10283d" font-size="16" font-weight="700">恢复 Thread</text>
      <path d="M772 616H872" stroke="#557083" stroke-width="3" marker-end="url(#arr)"/>
      <circle cx="930" cy="616" r="34" fill="#dceffb" stroke="#9cc9e4" stroke-width="2"/><text x="930" y="623" text-anchor="middle" fill="#12628d" font-size="18" font-weight="700">NEW</text>
      <text x="930" y="674" text-anchor="middle" fill="#10283d" font-size="16" font-weight="700">开始新 Turn</text>
    </g>
  </g>

  <rect x="250" y="754" width="700" height="50" rx="25" fill="#10283d"/>
  <text x="600" y="786" text-anchor="middle" fill="#eaf5f8" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600">被暂停的是执行；被保留的是可继续解释的现场</text>
  <text x="72" y="844" fill="#789" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="15">CODEX AGENT SERIES  ·  RECOVERY FLOW 05</text>
</svg>
